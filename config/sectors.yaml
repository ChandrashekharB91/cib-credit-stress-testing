# Sector parameters for the synthetic CIB portfolio and the stressed-financials satellite model.
#   share            portfolio share of obligors
#   rev_median_musd  median annual revenue (USD m); rev_sigma = lognormal dispersion
#   margin_mean/sd   EBITDA margin
#   leverage_median  gross Debt / EBITDA
#   capex_ratio      capex / revenue
#   floating_share   share of debt at floating rates
#   trend_growth     nominal revenue growth at trend GDP
#   beta_gdp         revenue growth sensitivity to (regional GDP growth - regional trend)
#   beta_oil         revenue growth sensitivity to oil price % change
#   beta_property    revenue growth sensitivity to (property price growth - trend)
#   dol              degree of operating leverage (EBITDA growth multiple of revenue shock)
#   risk_premium     latent log-odds premium used only in the synthetic data generator
#   collateral       typical collateral type for secured facilities
#   cyclicality      strength of ratio co-movement with the cycle in the synthetic history
sectors:
  oil_gas:
    share: 0.09
    rev_median_musd: 900
    rev_sigma: 1.1
    margin_mean: 0.24
    margin_sd: 0.07
    leverage_median: 2.4
    capex_ratio: 0.14
    floating_share: 0.5
    trend_growth: 0.04
    beta_gdp: 1.0
    beta_oil: 0.65

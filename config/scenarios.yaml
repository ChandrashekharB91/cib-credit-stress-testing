# Management Stress Testing (MST) macro scenarios — 3-year horizon, annual steps.
# Illustrative scenarios designed for this project (not official supervisory scenarios).
# Regions follow a generic emerging-markets CIB footprint:
#   GCNA = Greater China & North Asia, ASA = ASEAN & South Asia,
#   AME  = Africa & Middle East,      EA  = Europe & Americas
jump_off:
  year: 2026
  unemployment: 4.9        # %
  policy_rate: 4.00        # %, USD reference rate
  oil_price: 75.0          # USD/bbl
horizon_years: [2027, 2028, 2029]

scenarios:
  baseline:
    narrative: >
      Central case: global growth near trend, gradual policy easing, stable commodity prices.
    gdp_growth:            # real GDP growth, % y/y
      GCNA: [4.2, 4.0, 3.9]
      ASA:  [5.0, 5.1, 5.0]
      AME:  [3.8, 3.9, 4.0]
      EA:   [1.8, 1.9, 1.9]
    global_gdp_growth: [3.1, 3.2, 3.2]
    unemployment: [5.0, 4.9, 4.9]
    policy_rate: [3.75, 3.50, 3.50]
    oil_price: [72.0, 73.0, 74.0]
    equity_return: [6.0, 6.0, 6.0]       # % y/y
    property_price_growth: [2.0, 3.0, 3.0]

  adverse:
    narrative: >
      Trade fragmentation: tariff escalation hits export-oriented Asian supply chains,
      sticky inflation delays easing, commodity prices soften and CRE values correct.
    gdp_growth:
      GCNA: [1.5, 2.0, 3.0]
      ASA:  [2.0, 2.8, 3.8]
      AME:  [1.5, 2.2, 3.0]
      EA:   [-0.5, 0.5, 1.4]
    global_gdp_growth: [0.8, 1.6, 2.6]
    unemployment: [6.0, 6.6, 6.3]
    policy_rate: [4.50, 4.00, 3.50]
    oil_price: [58.0, 62.0, 66.0]
    equity_return: [-18.0, 4.0, 8.0]
    property_price_growth: [-8.0, -4.0, 1.0]

  severe:
    narrative: >
      Synchronised Asia-led downturn: China property and credit stress spills over to
      regional trade, a USD funding shock forces a rate spike, commodities collapse and
      global equities fall sharply before a slow recovery in year 3.
    gdp_growth:
      GCNA: [-2.0, 0.0, 2.5]
      ASA:  [-1.5, 0.8, 3.0]
      AME:  [-2.5, 0.0, 2.2]
      EA:   [-2.5, -0.8, 1.0]
    global_gdp_growth: [-2.2, 0.0, 2.2]
    unemployment: [7.2, 8.4, 7.8]
    policy_rate: [6.00, 5.00, 4.00]
    oil_price: [40.0, 45.0, 55.0]
    equity_return: [-38.0, -5.0, 10.0]
    property_price_growth: [-20.0, -12.0, -2.0]
